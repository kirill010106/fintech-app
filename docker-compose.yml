services:
  postgres:
    image: postgres:16-alpine
    container_name: family_bank_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vtb_family
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vtb_family"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: family_bank_backend
    restart: always
    environment:
      ENV: dev
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/vtb_family?sslmode=disable
      # Задайте собственный секрет перед публикацией: он подписывает JWT.
      APP_SECRET: ${APP_SECRET:-change-me-in-production}
      HTTP_ADDRESS: :8080
      HTTP_TIMEOUT: 10s
      HTTP_IDLE_TIMEOUT: 60s
      CLIENT_URL: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: family_bank_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
